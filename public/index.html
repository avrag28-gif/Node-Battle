<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Node-Battle Arena</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:system-ui,sans-serif}#app{position:relative}canvas{display:block}.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;align-items:center;pointer-events:none}.pill{background:#0b1019dd;border:1px solid #ffffff22;color:#fff;padding:7px 12px;border-radius:999px;font-weight:900;text-shadow:0 2px 6px #000}.labels{position:fixed;inset:0;z-index:15;pointer-events:none}.tank-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000}.tank-label .name{display:block}.tank-label .hearts{display:block;color:#ff6b81;font-size:11px}.effect{position:absolute;transform:translate(-50%,-50%);font-weight:900;text-shadow:0 2px 6px #000;animation:float .9s ease-out forwards}.result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#02040bcc;backdrop-filter:blur(5px)}.card{padding:28px 40px;border:1px solid #fbbf24aa;border-radius:24px;background:#0b1019ee;text-align:center;color:white;box-shadow:0 0 60px #f59e0b44}.card h1{margin:0 0 8px;font-size:34px}.card p{margin:0;color:#fbbf24;font-weight:900}@keyframes float{from{opacity:1;transform:translate(-50%,-40%)}to{opacity:0;transform:translate(-50%,-150%)}}</style></head><body><div id="app"></div><div class="hud"><div class="pill" id="theme">WAITING</div><div class="pill" id="timer">0:00</div><div class="pill" id="count">0/4 TANKS</div></div><div class="labels" id="labels"></div><div id="result"></div><script type="module" src="/arena.js"></script></body></html>
