<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Node-Battle Leaderboard</title><style>body{margin:0;background:#080b10;color:#fff;font-family:system-ui,sans-serif;padding:28px}.wrap{max-width:850px;margin:auto}.panel{background:#111822;border:1px solid #ffffff18;border-radius:18px;padding:20px;margin:18px 0}h1{margin-top:0}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ffffff10}th{color:#9ca3af;font-size:12px;text-transform:uppercase}.rank{font-weight:900}.live{color:#7dd3fc}.global{color:#c4b5fd}</style></head><body><div class="wrap"><h1>🏆 Node-Battle Leaderboard</h1><div class="panel"><h2 class="live">Current Match</h2><table><thead><tr><th>#</th><th>Player</th><th>Kills</th><th>❤️</th><th>Evolution</th></tr></thead><tbody id="match"></tbody></table></div><div class="panel"><h2 class="global">Global</h2><table><thead><tr><th>#</th><th>Player</th><th>Total Kills</th><th>Matches</th><th>Wins</th></tr></thead><tbody id="global"></tbody></table></div></div><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function render(s){document.getElementById('match').innerHTML=s.matchLeaderboard.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.username)}</td><td>${p.kills}</td><td>${p.hearts}</td><td>Lv.${p.evolution}</td></tr>`).join('');document.getElementById('global').innerHTML=s.globalLeaderboard.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.username)}</td><td>${p.totalKills}</td><td>${p.totalMatches}</td><td>${p.totalWins}</td></tr>`).join('')}fetch('/api/status').then(r=>r.json()).then(render);const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='STATE')render(x.data)};</script></body></html>
